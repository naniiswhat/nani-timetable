<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>Nani's Timetable</h1>
                <div class="header-meta">Burning brighter than ever!</div>
            </div>
            <div class="header-actions">
                <button id="themeToggleBtn" class="btn-secondary">🌸 Theme</button>
                <button id="addBtn" class="btn-primary">+ Add Entry</button>
            </div>
        </header>

        <div class="table-container">
            <!-- Timeline Header -->
            <div class="timeline-header">
                <div class="day-label-space"></div>
                <div class="time-slots">
                    <div class="slot">8 AM</div>
                    <div class="slot">9 AM</div>
                    <div class="slot">10 AM</div>
                    <div class="slot">11 AM</div>
                    <div class="slot">12 PM</div>
                    <div class="slot">1 PM</div>
                    <div class="slot">2 PM</div>
                    <div class="slot">3 PM</div>
                    <div class="slot">4 PM</div>
                    <div class="slot end-slot">5 PM <small>6 PM</small></div>
                </div>
            </div>

            <!-- The Grid -->
            <div class="grid-body" id="gridBody">
                <!-- Universal Break Overlay (1:00 PM - 1:50 PM) -->
                <div class="break-column">
                    <div class="break-text">BREAK</div>
                </div>

                <!-- Day Rows will be generated by JS here -->
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <h2>Add New Entry</h2>
            <form id="classForm">
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="subjectName" placeholder="e.g. Object Oriented Programming" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="locationName" placeholder="e.g. DK9" required>
                </div>
                <div class="form-group">
                    <label>Day</label>
                    <select id="classDay">
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                    </select>
                </div>
                <div class="form-group row">
                    <div class="col">
                        <label>Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="col">
                        <label>End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
