<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>Nani's Timetable Creator</h1>
                <div class="header-meta">Continue burning brighter than the sun!</div>
            </div>
            <div class="header-actions">
                <button id="themeSettingsBtn" class="btn-secondary">⚙️ Settings</button>
                <button id="addBtn" class="btn-primary">+ Add Entry</button>
            </div>
        </header>

        <!-- Desktop & iPad Landscape Matrix View -->
        <div class="table-container" id="matrixView">
            <div class="timeline-header">
                <div class="day-label-space"></div>
                <div class="time-slots">
                    <div class="slot">8 AM</div>
                    <div class="slot">9 AM</div>
                    <div class="slot">10 AM</div>
                    <div class="slot">11 AM</div>
                    <div class="slot">12 PM</div>
                    <div class="slot">1 PM</div>
                    <div class="slot">2 PM</div>
                    <div class="slot">3 PM</div>
                    <div class="slot">4 PM</div>
                    <div class="slot end-slot">5 PM <small>6 PM</small></div>
                </div>
            </div>

            <div class="grid-body" id="gridBody">
                <div class="break-column" id="breakColumn">
                    <div class="break-text">BREAK</div>
                </div>
                <!-- Day Rows generated by JS -->
            </div>
        </div>

        <!-- Mobile Portrait Agenda View -->
        <div class="mobile-list" id="mobileList">
            <!-- Vertical day cards generated by JS -->
        </div>
    </div>

    <!-- Settings & Theme Modal -->
    <div id="themeModalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <h2>Settings & Theme</h2>

            <form id="themeForm">
                <!-- Break Settings -->
                <label style="font-weight: 600; color: var(--text-main); margin-bottom: 12px; display: block;">Break
                    Time</label>
                <div class="form-group row">
                    <div class="col">
                        <label>Start Time</label>
                        <input type="time" id="breakStart" required>
                    </div>
                    <div class="col">
                        <label>End Time</label>
                        <input type="time" id="breakEnd" required>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px dashed var(--border); margin: 20px 0;">

                <!-- Theme Presets (Dynamically populated) -->
                <label style="font-weight: 600; color: var(--text-main); margin-bottom: 12px; display: block;">Theme
                    Presets</label>
                <div id="presetContainer" class="preset-container">
                    <!-- Preset buttons injected here -->
                </div>

                <!-- Custom Colors -->
                <label style="font-weight: 600; color: var(--text-main); margin-bottom: 12px; display: block;">Custom
                    Colors</label>
                <div class="form-group row">
                    <div class="col">
                        <label>Background</label>
                        <input type="color" id="customBg">
                    </div>
                    <div class="col">
                        <label>Card Surface</label>
                        <input type="color" id="customCard">
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col">
                        <label>Accent</label>
                        <input type="color" id="customAccent">
                    </div>
                    <div class="col">
                        <label>Border</label>
                        <input type="color" id="customBorder">
                    </div>
                </div>
                <div class="form-group">
                    <label>Text Color</label>
                    <input type="color" id="customText">
                </div>

                <!-- Save Theme Feature -->
                <div class="save-theme-box">
                    <div class="form-group row" style="align-items: flex-end; margin-bottom: 0;">
                        <div class="col" style="flex: 2;">
                            <label>Save these colors as a preset</label>
                            <input type="text" id="newThemeName" placeholder="e.g. Midnight Blue">
                        </div>
                        <div class="col" style="flex: 1;">
                            <button type="button" id="savePresetBtn" class="btn-secondary"
                                style="width: 100%; height: 44px; padding: 0;">Save Theme</button>
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="closeThemeBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Apply Settings</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add/Edit Entry Modal -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <h2 id="classModalTitle">Add New Entry</h2>
            <form id="classForm">
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="subjectName" placeholder="e.g. Object Oriented Programming" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="locationName" placeholder="e.g. DK9" required>
                </div>
                <div class="form-group">
                    <label>Day</label>
                    <select id="classDay">
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                    </select>
                </div>
                <div class="form-group row">
                    <div class="col">
                        <label>Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="col">
                        <label>End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
